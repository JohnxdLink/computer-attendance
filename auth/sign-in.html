<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | BRITECH College</title>

    <link rel="stylesheet" href="../assets/css/pages/sign-in.css" />
  </head>

  <header>
    <div class="wrap nav">
      <div class="brand">
        <img src="../assets/images/logo/britech-logo.png " width="100" height="100" alt="" />
      </div>
    </div>
  </header>

  <body class="britech-style-login">
    <!-- LOGIN CARD -->
    <div class="britech-login-card">
      <h2>Log in to BRITECH</h2>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Student ID" required />

        <input type="password" id="password" placeholder="Student Name" required />

        <button type="submit" class="login-main-button">Log In</button>
      </form>
      <a href="#" class="forgot-password"> Forgot password? </a>

      <div class="login-divider">
        <span></span>
        <small>or</small>
        <span></span>
      </div>

      <a href="#" class="create-account"> Create New Account </a>
    </div>

    <!-- BACK TO WEBSITE -->
    <div class="back-website">
      <a href="../index.html"> ← Back to BRITECH College website </a>
    </div>

    <!-- FOOTER -->
    <footer class="simple-login-footer">
      <p>© 2026 BRITECH College</p>
    </footer>
  </body>
</html>
