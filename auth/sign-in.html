<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Attendance - Britech College</title>
    <link rel="stylesheet" href="./asset/css/style.css" />
    <link rel="stylesheet" href="./asset/css/pages/landing.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="col-logo">
        <img src="images/britech-logo.png" alt="Britech Logo" />
        <h2>Britech College</h2>
        <p>Computer Attendance Monitoring System.</p>
      </div>

      <div class="form-container">
        <form action="#">
          <div class="input-group">
            <input type="text" placeholder="Full Name" required />
          </div>
          <div class="input-group">
            <input type="password" placeholder="Student ID Number" required />
          </div>
          <button type="submit" class="btn-login">LOG IN</button>
          <a href="#" class="forgot-link">Forgot School ID?</a>
          <div class="divider"></div>
        </form>
      </div>

      <p class="sub-text"><a href="#">Create a Page</a> for School Purposes and Computer Monitoring.</p>

      <footer>
        <div class="footer-contents">
          <ul>
            <li><a href="#">Sign Up</a></li>
            <li><a href="#">Log In</a></li>
          </ul>
          <small>Britech College © 2026</small>
        </div>
      </footer>
    </div>
  </body>
</html>
